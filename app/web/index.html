<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bazá Tranquilo — Bazá com Segurança.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bazá">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bazá Tranquilo</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Ecrã de carregamento, mostrado até o app desenhar o primeiro ecrã. -->
  <style>
    #loader { position: fixed; inset: 0; background: #FFC400; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #14161A; transition: opacity .35s; z-index: 10; }
    #loader img { width: 112px; height: 112px; animation: baza-in .7s cubic-bezier(.2,1.4,.4,1) both; }
    #loader .name { font-size: 44px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; margin-top: 4px; }
    #loader .name span { font-weight: 500; }
    #loader .slogan { margin-top: 10px; font-size: 16px; font-weight: 600; }
    #loader .bar { margin-top: 34px; width: 120px; height: 4px; border-radius: 4px; background: rgba(20,22,26,.18); overflow: hidden; }
    #loader .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #14161A; animation: baza-bar 1.1s ease-in-out infinite; }
    @keyframes baza-in { from { transform: translate(-46px, 46px) scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes baza-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #loader img, #loader .bar i { animation: none; } }
  </style>
  <div id="loader" role="status" aria-label="A carregar o Bazá">
    <img src="assets/assets/brand/arrow.svg" alt="">
    <div class="name">Bazá <span>Tranquilo</span></div>
    <div class="slogan">Bazá com Segurança</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loader');
      if (!el) return; // já foi retirado (o app pode redesenhar-se mais de uma vez)
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
